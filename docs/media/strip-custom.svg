<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520">
<title>Make Keel yours</title>
<rect width="1280" height="520" rx="28" fill="#140E22"/>
<text x="48" y="56" fill="#C4B5FD" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2">MAKE IT YOURS</text>
<text x="1120" y="52" fill="#F5F3FF" font-family="Georgia, serif" font-size="22" font-weight="700">Keel</text>
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="40" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#3B2F66"/>
  <text x="64" y="130" fill="#A39BB8" font-size="14">Frame rate</text>
  <rect x="64" y="146" width="70" height="32" rx="8" fill="#2A2144"/><text x="99" y="167" text-anchor="middle" fill="#F5F3FF" font-size="14">Off</text>
  <rect x="142" y="146" width="78" height="32" rx="8" fill="#8B6CFF"/><text x="181" y="167" text-anchor="middle" fill="#1A1033" font-size="14" font-weight="700">60 fps</text>
  <text x="240" y="167" fill="#A39BB8" font-size="14">90</text>
  <text x="290" y="167" fill="#A39BB8" font-size="14">120</text>
  <text x="64" y="214" fill="#A39BB8" font-size="14">Output size</text>
  <rect x="64" y="230" width="90" height="32" rx="8" fill="#2A2144"/><text x="109" y="251" text-anchor="middle" fill="#F5F3FF" font-size="14">Window</text>
  <rect x="162" y="230" width="70" height="32" rx="8" fill="#8B6CFF"/><text x="197" y="251" text-anchor="middle" fill="#1A1033" font-size="14" font-weight="700">4K</text>
  <rect x="64" y="290" width="150" height="40" rx="10" fill="#8B6CFF"/>
  <text x="139" y="316" text-anchor="middle" fill="#1A1033" font-size="15" font-weight="700">Auto-detect</text>

  <rect x="450" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#3B2F66"/>
  <rect x="470" y="110" width="110" height="200" fill="#3A4A62"/>
  <rect x="580" y="110" width="110" height="200" fill="#C4A574"/>
  <rect x="690" y="110" width="120" height="200" fill="#2A2A2E"/>
  <text x="525" y="290" text-anchor="middle" fill="#F5F3FF" font-size="12">ORIGINAL</text>
  <text x="635" y="290" text-anchor="middle" fill="#1A1033" font-size="12" font-weight="700">GOLDEN HOUR</text>
  <text x="750" y="290" text-anchor="middle" fill="#F5F3FF" font-size="12">NOIR</text>

  <rect x="860" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#3B2F66"/>
  <text x="884" y="140" fill="#A39BB8" font-size="15">Motion detail</text><text x="1160" y="140" text-anchor="end" fill="#F5F3FF" font-size="15">Auto</text>
  <text x="884" y="176" fill="#A39BB8" font-size="15">Upscaler</text><text x="1160" y="176" text-anchor="end" fill="#F5F3FF" font-size="15">DLSS</text>
  <text x="884" y="212" fill="#C4B5FD" font-size="16" font-weight="700">Which look</text><text x="1160" y="212" text-anchor="end" fill="#C4B5FD" font-size="16" font-weight="700">Neon night</text>
  <text x="884" y="248" fill="#A39BB8" font-size="15">Fullscreen</text><text x="1160" y="248" text-anchor="end" fill="#F5F3FF" font-size="15">Off</text>
  <text x="884" y="284" fill="#A39BB8" font-size="15">Output size</text><text x="1160" y="284" text-anchor="end" fill="#F5F3FF" font-size="15">4K</text>
  <text x="884" y="330" fill="#8B6CFF" font-size="13">Press M. Most changes apply at once.</text>

  <text x="230" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">1  Pick the rate</text>
  <text x="640" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">2  Give it a look</text>
  <text x="1050" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">3  Adjust mid-game</text>
  <text x="230" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">60, 90 or 120. Or 4K.</text>
  <text x="640" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">Built-in looks, or your own.</text>
  <text x="1050" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">The menu opens over the game.</text>
</g>
</svg>
