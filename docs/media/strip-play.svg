<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520">
<title>Playing with Keel</title>
<rect width="1280" height="520" rx="28" fill="#140E22"/>
<text x="48" y="56" fill="#C4B5FD" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2">PLAY</text>
<text x="1120" y="52" fill="#F5F3FF" font-family="Georgia, serif" font-size="22" font-weight="700">Keel</text>
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="40" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#3B2F66"/>
  <text x="64" y="140" fill="#F5F3FF" font-size="26" font-weight="700">Connect your PS5</text>
  <text x="64" y="190" fill="#C4B5FD" font-size="16">1  Turn on Remote Play</text>
  <text x="64" y="228" fill="#C4B5FD" font-size="16">2  Wake it if it is resting</text>
  <text x="64" y="266" fill="#C4B5FD" font-size="16">3  Sign in once in chiaki-ng</text>
  <text x="64" y="320" fill="#A39BB8" font-size="14">About five minutes, one time.</text>

  <rect x="450" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#3B2F66"/>
  <circle cx="640" cy="200" r="62" fill="#8B6CFF"/>
  <path d="M624 176 L678 200 L624 224 Z" fill="#1A1033"/>
  <text x="640" y="310" text-anchor="middle" fill="#F5F3FF" font-size="22" font-weight="700">Ready when you are</text>

  <rect x="860" y="88" width="380" height="280" rx="18" fill="#1C1630" stroke="#8B6CFF"/>
  <rect x="888" y="120" width="324" height="28" rx="6" fill="#8B6CFF"/>
  <text x="1050" y="140" text-anchor="middle" fill="#1A1033" font-size="13" font-weight="700">AI FRAME · DRAWN BY KEEL</text>
  <rect x="888" y="160" width="324" height="150" rx="10" fill="#241B3A"/>
  <text x="1050" y="244" text-anchor="middle" fill="#C4B5FD" font-size="16">60 · 90 · 120 fps</text>

  <text x="230" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">1  Connect your console</text>
  <text x="640" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">2  Hit Play</text>
  <text x="1050" y="420" text-anchor="middle" fill="#F5F3FF" font-size="18" font-weight="700">3  That's it</text>
  <text x="230" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">A short guide, once.</text>
  <text x="640" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">Your controller still works.</text>
  <text x="1050" y="448" text-anchor="middle" fill="#A39BB8" font-size="14">Same game, smoother.</text>
</g>
</svg>
