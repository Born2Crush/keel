# Starts a release as a draft, published under the project rather than a person.
# Run it from the Actions tab, or: gh workflow run release.yml -f tag=v0.1.0 -f title="SmoovPlay 0.1.0 (early release)"
# Then add the notes, upload SmoovPlay-Setup.exe and SmoovPlay-Setup.exe.sig from installer/dist to the draft,
# and publish it.
name: Draft a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v0.1.0
        required: true
      title:
        description: Release title
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "Notes to follow."
