name: Publish installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-installer
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the icon tools
        run: python -m pip install opencv-python-headless numpy

      - name: Use RTX Video Super Resolution instead of DLSS
        run: python installer/use_vsr.py

      - name: Ask for 200 Mbps and overlap the frame check
        run: python installer/faster.py

      - name: Join a stream that is already running
        run: python installer/patch_stream_join.py

      - name: Build Keel-Setup.exe
        run: python installer/build.py --app-setup --version 0.3.66

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.66
          name: Keel 0.3.66
          make_latest: true
          files: installer/dist/Keel-Setup.exe
          body: |
            Double-click Keel-Setup.exe.
            It installs Keel as an app: a window, a Start menu shortcut, and an entry in Windows Settings under Apps.
            The window uses the purple Keel wordmark. The counter was reading 120 while the picture only changed at the game's rate. In-between frames are back, drawn the same way as the stream. The upscaler stays off. Your settings stay.
            Uninstall is in the Keel window on the Help page, and in Settings, Apps.
