name: Publish package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Windows package
        run: |
          sed -i 's/VERSION = "0.3.12"/VERSION = "0.3.13"/' installer/build.py
          python installer/make_package.py

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.13
          name: Keel 0.3.13 for Windows
          make_latest: true
          body: |
            Unzip Keel-0.3.13-windows.zip and run Install-Keel.bat.
            Keel starts the chiaki-ng already installed by SmoovPlay, with the frame tap on.
            Python, PyTorch, and TensorRT download on install if they are not there yet (about 5 GB the first time).
          files: |
            installer/dist/Keel-0.3.13-windows.zip
            installer/dist/Keel-0.3.13-windows.zip.sha256

      - name: Install ORAS
        run: |
          curl -sSL -o oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz
          tar -xzf oras.tgz
          sudo mv oras /usr/local/bin/oras

      - name: Publish the package
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/born2crush/keel:0.3.13" \
            installer/dist/Keel-0.3.13-windows.zip:application/zip \
            installer/dist/Keel-0.3.13-windows.zip.sha256:text/plain
