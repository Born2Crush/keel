name: Publish installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-installer
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the icon tools
        run: python -m pip install opencv-python-headless numpy

      - name: Build Keel-Setup.exe
        run: python installer/build.py --app-setup --version 0.3.18

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.18
          name: Keel 0.3.18
          make_latest: true
          files: installer/dist/Keel-Setup.exe
          body: |
            Double-click Keel-Setup.exe.
            It installs Keel as an app: a window, a Start menu shortcut, and an entry in Windows Settings under Apps.
            The window uses the purple Keel wordmark. The upscaler list starts on NVIDIA DLSS, which draws a 1080p stream at 4K. Play starts chiaki-ng from the copy already on this PC. There is no terminal.
            Uninstall is in the Keel window on the Help page, and in Settings, Apps.
